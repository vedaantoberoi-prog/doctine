# Doctine · nightly encrypted database backup (production Supabase).
#
# Why: the Supabase Free plan has no backups at all. This keeps 30 days of nightly copies.
# This repository is PUBLIC, so every backup is encrypted (AES-256) before it leaves the runner.
# Only someone holding BACKUP_PASSPHRASE can read it. Nothing is printed to the log.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions). Add them yourself:
#   SUPABASE_DB_URL    Supabase → Connect → "Session pooler" URI, with the database password filled in
#   BACKUP_PASSPHRASE  a long random passphrase (at least 32 characters) kept in your password manager
# Until both are set, the job skips with a notice instead of failing.
#
# Covers: all tables (public), accounts (auth) and file records (storage metadata).
# Not covered: the uploaded files' bytes in the storage bucket (see docs/BACKUP_RESTORE.md).
name: Nightly backup
on:
  schedule: [{ cron: "40 20 * * *" }] # 02:10 IST
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: backup, cancel-in-progress: false }
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the secrets are set
        id: cfg
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then
            echo "::warning::Backup skipped: add the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets (see the top of backup.yml)."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${#PASS}" -lt 32 ]; then echo "::error::BACKUP_PASSPHRASE must be at least 32 characters (the repository is public)."; exit 1; fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Install pg_dump 17
        if: steps.cfg.outputs.ready == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get -qq update && sudo apt-get -qq install -y postgresql-client-17 >/dev/null
      - name: Dump, encrypt and check
        if: steps.cfg.outputs.ready == 'true'
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          mkdir -p out
          /usr/lib/postgresql/17/bin/pg_dump "$DB" -Fc --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage -f "$RUNNER_TEMP/db.dump" 2> "$RUNNER_TEMP/err" \
            || { echo "::error::pg_dump failed (details withheld from this public log)"; exit 1; }
          n=$(/usr/lib/postgresql/17/bin/pg_restore --list "$RUNNER_TEMP/db.dump" | grep -c "TABLE DATA" || true)
          [ "$n" -ge 13 ] || { echo "::error::backup looks incomplete ($n tables with data entries)"; exit 1; }
          printf %s "$PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --s2k-digest-algo SHA512 --s2k-count 65011712 \
            -o "out/doctine-db-$stamp.dump.gpg" "$RUNNER_TEMP/db.dump"
          # prove the encrypted copy opens and is a valid dump, then remove every plain copy
          printf %s "$PASS" | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 -d "out/doctine-db-$stamp.dump.gpg" \
            | /usr/lib/postgresql/17/bin/pg_restore --list > /dev/null
          shred -u "$RUNNER_TEMP/db.dump" "$RUNNER_TEMP/err"
          echo "Backup $stamp: $n tables, $(du -h out/*.gpg | cut -f1) encrypted." >> "$GITHUB_STEP_SUMMARY"
      - name: Keep for 30 days
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with: { name: doctine-db-backup, path: out/, retention-days: 30, if-no-files-found: error }
