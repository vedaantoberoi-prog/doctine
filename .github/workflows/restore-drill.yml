# Doctine · backup restore drill (docs/BACKUP_RESTORE.md, "Restore drill").
#
# Proves the newest nightly backup can actually be restored and used, not just that the backup job is green.
# It never writes to production: production is only asked for read-only row counts.
#   1. downloads the newest successful "doctine-db-backup" artifact from the Nightly backup workflow;
#   2. decrypts it with BACKUP_PASSPHRASE inside this runner;
#   3. runs tools/restore-drill.sh: builds a throwaway database from the repository's migrations, restores every
#      app table (public and private) into it, compares row counts with production, checks every reference resolves,
#      every medical record has an account in the backup, and that row-level security shows a restored person all of
#      their own records and none of anyone else's;
#   4. shreds the decrypted copy. The database disappears with the runner.
# The repository is PUBLIC: the log shows only pass/fail per check, never data, ids, names or counts.
name: Backup restore drill
on:
  workflow_dispatch:
  schedule: [{ cron: "20 23 * * 1" }] # Tuesdays 04:50 IST, after the nightly backup
permissions: { contents: read, actions: read }
concurrency: { group: restore-drill, cancel-in-progress: false }
jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      pg:
        image: postgres:17
        env: { POSTGRES_PASSWORD: drill-only-local, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are set
        env: { PW: "${{ secrets.SUPABASE_DB_PASSWORD }}", PASS: "${{ secrets.BACKUP_PASSPHRASE }}" }
        run: |
          if [ -z "$PW" ] || [ -z "$PASS" ]; then echo "::error::SUPABASE_DB_PASSWORD and BACKUP_PASSPHRASE are needed (see backup.yml)."; exit 1; fi
      - name: Install the Postgres 17 tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get -qq update && sudo apt-get -qq install -y postgresql-client-17 >/dev/null
      - name: Download the newest backup
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          read -r run created < <(gh run list -R "$GITHUB_REPOSITORY" --workflow backup.yml --status success -L 1 --json databaseId,createdAt --jq '.[0] | "\(.databaseId) \(.createdAt)"')
          [ -n "$run" ] || { echo "::error::No successful backup run found."; exit 1; }
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n doctine-db-backup -D "$RUNNER_TEMP/bk"
          age=$(( ( $(date -u +%s) - $(date -u -d "$created" +%s) ) / 3600 ))
          echo "Newest backup: run $run, $age hours old." >> "$GITHUB_STEP_SUMMARY"
          [ "$age" -le 48 ] || { echo "::error::The newest backup is $age hours old (expected nightly)."; exit 1; }
      - name: Decrypt (nothing printed)
        env: { PASS: "${{ secrets.BACKUP_PASSPHRASE }}" }
        run: |
          set -euo pipefail
          umask 077
          f=$(ls "$RUNNER_TEMP"/bk/*.dump.gpg | sort | tail -1)
          printf %s "$PASS" | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 -d "$f" > "$RUNNER_TEMP/db.dump" \
            || { echo "::error::The backup could not be decrypted with BACKUP_PASSPHRASE."; exit 1; }
          echo "Decrypted with BACKUP_PASSPHRASE." >> "$GITHUB_STEP_SUMMARY"
      - name: Restore and check
        env:
          PW: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGBIN: /usr/lib/postgresql/17/bin
          DRILL_HOST: localhost
          DRILL_USER: postgres
          DRILL_PASSWORD: drill-only-local
          LIVE_HOST: aws-0-ap-south-1.pooler.supabase.com
          LIVE_USER: postgres.ggqctflfwpfkemgehizq
          LIVE_DB: postgres
          LIVE_SSLMODE: require
        run: |
          set -euo pipefail
          PW="${PW%$'\n'}"; PW="${PW%$'\r'}"
          mkdir -m 700 "$RUNNER_TEMP/drill"
          DUMP="$RUNNER_TEMP/db.dump" SUMMARY="$GITHUB_STEP_SUMMARY" RUNNER_TEMP_DIR="$RUNNER_TEMP/drill" LIVE_PASSWORD="$PW" \
            bash tools/restore-drill.sh > /dev/null 2> "$RUNNER_TEMP/drill/stderr" \
            || { echo "::error::The restore drill failed; see the job summary (details withheld from this public log)."; exit 1; }
      - name: Remove the decrypted copy
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/db.dump" ] && shred -u "$RUNNER_TEMP/db.dump" || true
          rm -rf "$RUNNER_TEMP/drill" "$RUNNER_TEMP/bk"
