# Doctine on Netlify. Deploy from Git or with the Netlify CLI: drag-and-drop deploys do not include functions.
[build]
  publish = "public"
  # Runs the server tests on every deploy; a failing test stops the deploy.
  command = "node tests/functions.test.mjs"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=()"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Written by the staging and release workflows at deploy time: which commit this deploy serves.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"
