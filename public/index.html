/* Asks the server's AI to read the pages. Resolves with the reading, or with {error} — never throws. */
async function readScan(blobs){

 try{const images=await Promise.all(blobs.slice(0,4).map(b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r({media_type:'image/jpeg',data:String(f.result).split(',')[1]});f.readAsDataURL(b)})));
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),32000);
  const r=await fetch(API+'/api/scan',{method:'POST',headers:{'Content-Type':'application/json',...await authHeaders()},body:JSON.stringify({action:'read',images}),signal:ac.signal}).finally(()=>clearTimeout(t));
  let j=null;try{j=await r.json()}catch{}
  if(!r.ok||!j||!j.doc)return{error:(j&&j.error)||((r.status===404||r.status===405||!j)?'no_server':'ai_error'),info:j||{}};
  return{doc:j.doc}}catch(e){return{error:e.name==='AbortError'?'ai_timeout':'network'}}}

const CATS={prescription:'Prescription',lab_report:'Lab report',imaging_report:'Imaging',discharge_summary:'Other',bill_or_receipt:'Other',other:'Other'};
const niceDate=d=>{const t=Date.parse(d);return t?new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):''};

async function saveScan(blobs,doc,{store:keep=true}={}){

 (d.lab_results||[]).forEach(l=>{if(l.test)fields[l.test.slice(0,60)]=`${l.value||''} ${l.unit||''}${l.range?' (ref '+l.range+')':''}`.trim()});

 const title=(d.title||'').trim()||(cat==='Other'?'Scanned document':cat)+' – '+niceDate(date);
 const rec={id,title:title.slice(0,120),cat,date,lab:(d.doctor||d.facility||'').slice(0,120),fields,imgs:blobs.length,scan:d.title?d:null};
 if(keep){for(let i=0;i<blobs.length;i++){try{await IMG.put(`scan:${id}:${i}`,blobs[i]);const o=blobs.originals&&blobs.originals[i];if(o&&/^image\/(jpeg|png|webp)$/.test(o.type)&&o.size<15e6)await IMG.put(`orig:${id}:${i}`,o)}catch{}}

/* Times for a prescription's frequency: 1-0-1 → morning and night, BD → twice a day, and so on. */
function freqTimes(f){f=String(f||'').toUpperCase().replace(/\s/g,'');const m=f.match(/^([\d½.]+)-([\d½.]+)-([\d½.]+)(?:-([\d½.]+))?$/);
 if(m){const parts=[m[1],m[2],m[3],m[4]].filter(x=>x!==undefined),t=parts.length===4?['08:00','14:00','20:00','22:00']:['08:00','14:00','21:00'];return t.filter((_,i)=>parts[i]&&!/^0+$/.test(parts[i]))}
 if(/QID|QDS/.test(f))return['08:00','12:00','16:00','20:00'];if(/TDS|TID/.test(f))return['08:00','14:00','20:00'];if(/BD|BID/.test(f))return['08:00','20:00'];if(/HS|BEDTIME/.test(f))return['22:00'];if(/OD|ONCE/.test(f))return['08:00'];return['08:00']}

/* Scan for records or medicines: camera → crop/clean → read → saved with a name. */
async function quickScan(camera,after,given){

const clErr=e=>{const c=e&&e.code;return c==='not_granted'||c==='sampling_disabled'?'ai_not_allowed':c==='rate_limited'?'ai_rate_limited':c==='cancelled'?'cancelled':c==='image_rejected'?'ai_image':c==='invalid_json'||c==='refused'||c==='empty_completion'?'bad_output':'ai_error'};
const CL_READ=`You read photographed medical documents for Doctine, an Indian personal health records app. Most are prescriptions handwritten by Indian doctors, often hurried, on printed letterheads, sometimes partly in Hindi. Others are lab reports, imaging reports, discharge summaries and bills.
Transcribe faithfully and structure. A wrong medicine name or dose can cause harm, so honesty about uncertainty matters more than completeness.
- Separate the printed letterhead (doctor, degrees, registration no., clinic, phones) from the handwriting. Prescriptions start after "Rx".
- Notation: Tab tablet, Cap capsule, Syp syrup, Inj injection, Oint ointment. OD once daily, BD twice, TDS thrice, QID four times, HS bedtime, SOS when needed, "1-0-1" = morning-afternoon-night. AC before food, PC after food. "x 5d" 5 days, "1/52" 1 week, "1/12" 1 month. c/o complaints, Dx/Imp diagnosis, Adv advised, F/U follow-up.
- Indian medicines are mostly brand names (Dolo, Pan-D, Augmentin, Montair-LC). Use brand knowledge only when the visible letters support it; if several fit, put the others in alternatives and set confidence medium or low.
- Never invent a dose, strength, frequency or duration; leave it "".
- Unreadable words: [?] in the transcription and an entry in unreadable.
- Dates are DD/MM/YYYY in India; give YYYY-MM-DD only when unambiguous.
- title: short record name like "Prescription – Dr. R. K. Sinha – 28 Oct 2026" or "CBC report – Lal PathLabs – 2 Sep 2026".
Reply with ONLY one JSON object:
{"title":"","type":"prescription|lab_report|imaging_report|discharge_summary|bill_or_receipt|other","date":"","doctor":"","facility":"","patient":"",
"medicines":[{"raw":"exact text","name":"","form":"","strength":"","frequency":"","timing":"","duration":"","instructions":"","confidence":"high|medium|low","alternatives":[]}],
"lab_results":[{"test":"","value":"","unit":"","range":"","flag":"","confidence":""}],"diagnoses":[],"complaints":[],"tests_advised":[],"advice":[],"follow_up":"",
"phones":[{"number":"","label":""}],"unreadable":[],"overall_confidence":"high|medium|low","transcription":"full text, at most about 3000 characters"}`;
const CL_ANSWER=`Reply with ONLY one JSON object:
{"reply":"main answer, short paragraphs","sections":[{"title":"","body":""}],"uncertainty":"what this can't tell them, or empty","safety_note":"or empty","urgency":"routine|same_day|emergency","question":"one optional follow-up question to offer, or empty","options":["short answer choices for that question"],"record_claims":[{"text":"","source":"R1"}]}`;
const CL_CHAT=`You are Doctine's health assistant for people in India. Give clear, warm, general health information in plain language. You are not a doctor: never diagnose, prescribe or change doses; explain what things usually mean, what helps, and when to see a doctor. When a concern is vague, give useful general information and offer one short follow-up question with answer options. If anything suggests an emergency (chest pain, trouble breathing, stroke signs, severe bleeding, fainting, suicidal thoughts, a very unwell infant), set urgency "emergency" and tell them to call 112 now. Use "same_day" when they should see a clinician today.
If saved records are provided, you may refer to them; then list each statement based on a record in record_claims with that record's id (R1, R2…). Never invent records.
`+CL_ANSWER;
const CL_EXPLAIN=`You are Doctine's health assistant for people in India. The person attached a medical document (its reading below, made from a photo of their paper) and is asking about it.
Explain in plain, warm language using the document's details: what it is and who wrote it; the diagnosis or findings and what they usually mean; each medicine — what it is generally used for and how the paper says to take it (repeat doses exactly as written; never suggest a different dose, stopping or starting anything); tests or results and what high/low values generally mean; follow-up and questions to ask the doctor. Where the reading is medium or low confidence or a word was unreadable, say so and tell them to confirm with their doctor or pharmacist. If anything suggests an emergency, set urgency "emergency" and tell them to call 112. Put the main answer in reply and details in sections (e.g. "Diagnosis", "Your medicines", "Tests", "Questions for your doctor"). Answer follow-ups directly, still grounded in the document.
`+CL_ANSWER;
function clAnswer(a){a=a&&typeof a==='object'?a:{};const st=v=>typeof v==='string'?v.trim():'';if(!st(a.reply))return null;
 return{reply:st(a.reply).slice(0,6000),sections:(Array.isArray(a.sections)?a.sections:[]).filter(x=>x&&st(x.title)&&st(x.body)).slice(0,8).map(x=>({title:st(x.title).slice(0,80),body:st(x.body).slice(0,4000)})),
  uncertainty:st(a.uncertainty),safety_note:st(a.safety_note),urgency:['routine','same_day','emergency'].includes(a.urgency)?a.urgency:'routine',question:st(a.question),options:(Array.isArray(a.options)?a.options:[]).map(st).filter(Boolean).slice(0,4),
  record_claims:(Array.isArray(a.record_claims)?a.record_claims:[]).filter(c=>c&&st(c.text)).slice(0,8).map(c=>({text:st(c.text),source:st(c.source)}))}}
function clDoc(d){d=d&&typeof d==='object'?d:{};const st=(v,n=400)=>typeof v==='string'?v.trim().slice(0,n):'',ar=v=>Array.isArray(v)?v.slice(0,30):[],cf=v=>['high','medium','low'].includes(v)?v:'low';
 return{title:st(d.title,120),type:['prescription','lab_report','imaging_report','discharge_summary','bill_or_receipt','other'].includes(d.type)?d.type:'other',date:st(d.date,20),doctor:st(d.doctor,120),facility:st(d.facility,160),patient:st(d.patient,120),
  medicines:ar(d.medicines).filter(m=>m&&(st(m.name)||st(m.raw))).map(m=>({raw:st(m.raw,200),name:st(m.name,100),form:st(m.form,40),strength:st(m.strength,60),frequency:st(m.frequency,60),timing:st(m.timing,60),duration:st(m.duration,60),instructions:st(m.instructions,200),confidence:cf(m.confidence),alternatives:ar(m.alternatives).map(x=>st(x,100)).filter(Boolean).slice(0,4)})),
  lab_results:ar(d.lab_results).filter(l=>l&&st(l.test)).map(l=>({test:st(l.test,80),value:st(l.value,40),unit:st(l.unit,30),range:st(l.range,60),flag:st(l.flag,10),confidence:cf(l.confidence)})),
  diagnoses:ar(d.diagnoses).map(x=>st(x,200)).filter(Boolean),complaints:ar(d.complaints).map(x=>st(x,200)).filter(Boolean),tests_advised:ar(d.tests_advised).map(x=>st(x,120)).filter(Boolean),advice:ar(d.advice).map(x=>st(x,240)).filter(Boolean),follow_up:st(d.follow_up,200),
  phones:ar(d.phones).filter(p=>p&&st(p.number)).map(p=>({number:st(p.number,30),label:st(p.label,40)})),unreadable:ar(d.unreadable).map(x=>st(x,160)).filter(Boolean),overall_confidence:cf(d.overall_confidence),transcription:st(d.transcription,4000)}}
async function clRead(blobs){try{const lim=await CL.limits().catch(()=>null);if(!lim||!lim.images)return{error:'ai_image'};
 const raw=await CL.json(CL_READ+'\n\n'+(blobs.length>1?`The ${blobs.length} images are pages of one document, in order.`:'The image is one document.')+' Read it.',{images:blobs.slice(0,lim.images.maxCount||4),cache:false});
 const doc=clDoc(raw);return doc.title||doc.transcription?{doc}:{error:'bad_output'}}catch(e){return{error:clErr(e)}}}
async function clAsk(messages,{doc,ctx,signal}){
 const head=doc?CL_EXPLAIN+'\n\nThe document, as read from the photo:\n'+JSON.stringify(doc):CL_CHAT+(ctx&&(ctx.records&&ctx.records.length||ctx.profile)?'\n\nSaved records and profile the person chose to share:\n'+JSON.stringify(ctx):'');
 const turns=[{role:'user',content:head},...messages];while(turns.length>1&&turns[turns.length-1].role!=='user')turns.pop();
 return clAnswer(await CL.json(turns,{signal,cache:false}))}
/* ---- saved chats: only for Doctine accounts, only while "Save my chats" is on (the database enforces this too) ---- */
/* Unsaved chat messages wait in a queue that belongs to ONE person and ONE sign-in: it records their Supabase user id
   and the sign-in (CLOUD.epoch). Signing out, switching account, deleting the account or switching saving off replaces
   the queue, and a save already in progress stops at its next step once the sign-in no longer matches. Nothing queued
   by one person can be written while someone else is signed in. */
function newHist(){return{uid:CLOUD.uid,epoch:CLOUD.epoch,pending:[],flushing:false,convs:{},dead:false}}
let HIST={uid:null,epoch:0,pending:[],flushing:false,convs:{},dead:false};
function resetHistory(){HIST.dead=true;HIST=newHist();S.histStatus='';S.histErr='';S.chatKey=Math.random().toString(36).slice(2)}
const historyOn=()=>S.cloud&&CLOUD.uid&&S.consent&&S.consent.history;
async function saveTurn(userText,answer){if(!historyOn())return;
 if(HIST.uid!==CLOUD.uid||HIST.epoch!==CLOUD.epoch)resetHistory();
 S.chatKey=S.chatKey||Math.random().toString(36).slice(2);
 HIST.pending.push({uid:CLOUD.uid,epoch:CLOUD.epoch,chat:S.chatKey,docRid:S.chatDoc&&S.chatDoc.rid!=null?S.chatDoc.rid:null,userText:String(userText),answer:{...answer}});
 S.histStatus='saving';await flushHistory()}
async function flushHistory(){const h=HIST;if(h.flushing||h.dead||!historyOn())return;h.flushing=true;
 const sb=CLOUD.sb,uid=h.uid;
 const alive=()=>!h.dead&&HIST===h&&CLOUD.uid===uid&&CLOUD.epoch===h.epoch&&historyOn();
 let failed='';
 try{
  const{data:sd}=await sb.auth.getSession();if(!alive())return;
  if(!sd||!sd.session||sd.session.user.id!==uid)throw new Error('your sign-in has changed');
  while(h.pending.length){const t=h.pending[0];
   if(t.uid!==uid||t.epoch!==h.epoch){h.pending.shift();continue}
   let conv=h.convs[t.chat];
   if(!conv){const docUuid=t.docRid!=null?CLOUD.ids.docs[t.docRid]||null:null;
    const{data,error}=await sb.from('conversations').insert({user_id:uid,title:t.userText.slice(0,80),document_id:docUuid}).select('id').single();
    if(!alive())return;if(error)throw error;conv=h.convs[t.chat]=data.id}
   const{error}=await sb.from('messages').insert([{user_id:uid,conversation_id:conv,role:'user',content:t.userText.slice(0,20000)},{user_id:uid,conversation_id:conv,role:'assistant',content:String(t.answer.reply||'').slice(0,20000),payload:t.answer}]);
   if(!alive())return;if(error)throw error;
   h.pending.shift()}
 }catch(e){failed=(e&&e.message)||'network problem';console.error('[history]',e)}
 finally{h.flushing=false}
 if(!alive())return;           // this queue's owner is no longer signed in here: change nothing on screen
 if(failed){S.histStatus='error';S.histErr=`${h.pending.length} message${h.pending.length===1?'':'s'} from this chat couldn’t be saved to your account (${failed}). Doctine will try again with your next message; they are not saved yet.`}
 else{S.histStatus='saved';S.histErr=''}
 if(S.view==='chat')render()}
async function loadHistoryList(){S.histOpen=true;S.histList=null;render();const{data,error}=await CLOUD.sb.from('conversations').select('id,title,updated_at').order('updated_at',{ascending:false}).limit(40);
 S.histList=error?{error:error.message}:data||[];render()}
async function openConversation(id){const{data,error}=await CLOUD.sb.from('messages').select('role,content,payload,created_at').eq('conversation_id',id).order('created_at',{ascending:true});
 if(error){toast('That chat couldn’t be opened: '+error.message);return}
 S.msgs=(data||[]).map(m=>m.role==='user'?{r:'u',t:m.content}:{r:'a',p:{...(m.payload||{}),reply:m.content},map:{}});
 S.chatKey='conv:'+id;if(HIST.uid===CLOUD.uid&&HIST.epoch===CLOUD.epoch)HIST.convs[S.chatKey]=id;S.histStatus='saved';S.cstate=null;S.chatDoc=null;S.histOpen=false;S.cerr='';render()}
async function deleteConversation(id){const{error}=await CLOUD.sb.from('conversations').delete().eq('id',id);if(error){toast('That chat couldn’t be deleted: '+error.message);return false}
 for(const[k,v]of Object.entries(HIST.convs))if(v===id){delete HIST.convs[k];if(S.chatKey===k){S.chatKey=Math.random().toString(36).slice(2);S.histStatus=''}}return true}
async function deleteAllConversations(){const{data,error}=await CLOUD.sb.from('conversations').select('id');if(error){toast('Saved chats couldn’t be deleted: '+error.message);return}
 for(const c of data||[])if(!await deleteConversation(c.id))return;toast('All saved chats deleted.');render()}

/* ---- documents in chat: scan or upload, read once, then every question about it gets a full explanation ---- */
async function attachDoc(camera){
 S.attMenu=false;
 const files=await pickFiles(camera,camera?undefined:'image/jpeg,image/png,image/webp,application/pdf');if(!files.length)return render();
 const f=files[0];let blobs=null,doc=null;
 try{
  if(!camera&&(f.type==='application/pdf'||/\.pdf$/i.test(f.name))){
   S.chatReading=f.name;render();
   let text='';try{text=(await readPdf(f)).join('\n')}catch(e){if(e.name==='PasswordException')throw new Error('This PDF is password-protected.')}
   if(text.replace(/\s/g,'').length>200)doc={title:f.name.replace(/\.pdf$/i,''),type:'other',transcription:text.slice(0,12000)};
   else blobs=await pdfImages(f)}
  else{blobs=await scanner(files,{action:'Attach'});if(!blobs)return render()}
  if(blobs){S.chatReading='document';render();const r=await readScan(blobs);
   if(!r.doc){S.chatReading='';S.cinfo=r.info||{};S.cerr=r.error;return render()}
   doc=r.doc;
   if(S.email&&!S.sample&&!S.guest){const rec=await saveScan(blobs,doc);toast('Also saved to Reports as “'+rec.title+'”')}}
  S.chatDoc={title:(doc.title||'Document').slice(0,80),doc};S.chatReading='';S.cerr='';render();const c=$('#ci');if(c)c.focus({preventScroll:true})
 }catch(e){S.chatReading='';toast(e.message||'That file could not be used.');render()}}

function ansView(x,last){const p=x.p,em=p.urgency==='emergency';if(p.ai_unavailable&&!p._n){p._n=1;p.safety_note=(p.safety_note?p.safety_note+' ':'')+'The AI assistant couldn’t be reached, so this is Doctine’s built-in safety guidance.'}

document.addEventListener('submit',async e=>{e.preventDefault();const id=e.target.id,F=new FormData(e.target);

  if(!d.name.trim()||!d.dose.trim())return err('Enter the medicine name and the dose exactly as prescribed.');
  if(!times.length||!times.every(x=>/^([01]\d|2[0-3]):[0-5]\d$/.test(x)))return err('Choose at least one time using the clock.');
  if(!st)return err('Choose a start date.');
  if(en&&en<st)return err('The end date must be on or after the start date.');
  const freq=d.freq,days=[...new Set(d.days)].sort();if(freq==='weekly'&&!days.length)return err('Pick at least one day for a weekly medicine.');
  if(d.src&&d.src.conf!=='high'&&!F.get('srcok'))return err('Tick the box once you’ve checked this medicine against the prescription.');
  const rec={name:d.name.trim(),dose:d.dose.trim(),times,start:st,end:en,freq,days:freq==='weekly'?days:[],...(d.src?{src:{doc:d.src.doc,raw:d.src.raw,conf:d.src.conf}}:{})};
  const ed=S.meds.find(x=>x.id==S.medEdit);if(ed){Object.assign(ed,rec);toast('Medicine updated')}else{S.meds.push({id:Date.now(),status:'active',...rec});toast('Medicine added')}if(S.medScan&&S.medScan.pending!=null){S.medScan.added[S.medScan.pending]=1;S.medScan.pending=null}S.medEdit=null;S.medDraft=null;render()}
 if(CLOUD.on&&['rf','lf','ff','npf'].includes(id)){const err=m=>{const a=$('#aerr');if(a)a.innerHTML=`<div class="err" role="alert">${esc(m)}</div>`},email=String(F.get('email')||'').trim().toLowerCase(),pw=String(F.get('pw')||''),btn=e.target.querySelector('button.pri');
  const nice=x=>/invalid login/i.test(x)?'Email or password is incorrect.':/already registered|already exists/i.test(x)?'An account with that email already exists. Try signing in.':/confirm/i.test(x)?'Please confirm your email first, using the link we sent you.':/rate|too many/i.test(x)?'Too many attempts. Please wait a minute and try again.':x;
  if(id!=='npf'&&!/^\S+@\S+\.\S+$/.test(email))return err('Enter a valid email address.');

  }catch{err('Network problem. Check your connection and try again.')}finally{if(btn)btn.disabled=false}
  return}
 if(id==='rf'||id==='lf'){const email=String(F.get('email')).trim().toLowerCase(),pw=String(F.get('pw')),err=m=>$('#aerr').innerHTML=`<div class="err">${esc(m)}</div>`;
  if(!/^\S+@\S+\.\S+$/.test(email))return err('Enter a valid email address.');
